# Runs only when label "review" is present on the PR (see job `if`).
# Requires repository secret CURSOR_API_KEY.
name: PR review

on:
  pull_request:
    types: [labeled, opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'review') ||
      (github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cursor SDK
        run: pip install cursor-sdk

      - name: Run PR review agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/review_pr.py
