services:
  recs-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - tfhub-cache:/app/.tfhub_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  tfhub-cache:
