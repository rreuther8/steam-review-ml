    eval_job_wired: true
    metrics_source: offline_eval
    metrics_table: eval_retrieval_overall
    eval_run_dir: artifacts/recs/offline_eval/runs/latest
    pool_contract: full_catalog
    notebook: notebooks/retrieval/recs_011_eval_retrieval_two_tower_comparison.ipynb
    decision_log_ref: docs/retrieval_decision_log.md
    notes: Hand-fused session + behavior query; eval benchmark only after two_tower_v1 ship.

  - experiment_id: v1_retrieve_two_tower_v1
    method_id: two_tower_v1
    stage: retrieval
    phase: v1
    status: shipped
    eval_job_wired: true
    metrics_source: offline_eval
    metrics_table: eval_retrieval_overall
