# Experiment registry manifest (metadata only — metrics exported from eval CSVs).
# See docs/plans/experiment_registry_plan.md and docs/experiment_registry.md.

version: 1
eval_contract:
  cohort: val_dev_12k_v1
  examples_parquet: artifacts/recs/eval_cache/val_dev_12k_v1/eval_examples.parquet
  k_retrieval: 100
  k_final: 10

default_paths:
  offline_eval_dir: artifacts/recs/offline_eval/runs/latest
  ranking_eval_dir: artifacts/recs/offline_eval/runs/latest_ranking

experiments:
  # --- v1 retrieval benchmarks (full offline job) ---
  - experiment_id: v1_retrieve_raw
    method_id: raw
    stage: retrieval
    phase: v1
    status: benchmark
    eval_job_wired: true
    metrics_source: offline_eval
    metrics_table: eval_retrieval_overall
    eval_run_dir: artifacts/recs/offline_eval/runs/latest
    pool_contract: full_catalog
    notebook: null
    decision_log_ref: docs/retrieval_decision_log.md
    notes: Phase-1 USE cosine baseline; same sort @100 and @10.

  - experiment_id: v1_retrieve_popularity_train
    method_id: popularity_train
    stage: retrieval
    phase: v1
    status: benchmark
    eval_job_wired: true
    metrics_source: offline_eval
    metrics_table: eval_retrieval_overall
    eval_run_dir: artifacts/recs/offline_eval/runs/latest
    pool_contract: full_catalog
    notebook: null
    decision_log_ref: docs/retrieval_decision_log.md
    notes: Global train-pop retrieval baseline; high Hit@100, non-personalized.

  - experiment_id: v1_retrieve_multi_mean_train
    method_id: multi_mean_train
    stage: retrieval
    phase: v1
    status: benchmark
    eval_job_wired: true
    metrics_source: offline_eval
    metrics_table: eval_retrieval_overall
    eval_run_dir: artifacts/recs/offline_eval/runs/latest
    pool_contract: full_catalog
    notebook: null
    decision_log_ref: docs/retrieval_decision_log.md
    notes: Phase-1 required baseline.

  - experiment_id: v1_retrieve_fusion_c
    method_id: fusion_c_raw_plus_behavior
