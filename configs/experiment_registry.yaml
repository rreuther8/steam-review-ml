    pool_contract: full_catalog
    notebook: notebooks/retrieval/recs_012_two_tower_training_rows_explore.ipynb
    decision_log_ref: docs/retrieval_decision_log.md#2026-05-30-chosen-retrieval-mechanism--two_tower_v1
    notes: Shipped retrieval mechanism @100; checkpoint updated_user__updated_profile200_item.

  # --- v1 ranking (offline job + rank-only job) ---
  - experiment_id: v1_rank_two_tower_bare
    method_id: two_tower_v1
    stage: ranking
    phase: v1
    status: benchmark
    eval_job_wired: true
