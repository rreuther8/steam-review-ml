    pool_contract: two_tower_v1@100_frozen_order
    notebook: null
    decision_log_ref: docs/ranking_decision_log.md
    notes: Bare pool order @10; weak NDCG without rerank.

  - experiment_id: v1_rank_d1_heuristic_logpop
