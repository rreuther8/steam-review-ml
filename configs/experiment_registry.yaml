    pool_contract: two_tower_v1@100_rerank
    notebook: notebooks/ranking/recs_013_ranker_d1_heuristic.ipynb
    decision_log_ref: docs/ranking_decision_log.md#2026-05-30-d1-shipped--heuristic-log-pop-blend-on-two_tower_v1-pools
    notes: Shipped ranker v1; alpha=0.2 log-pop blend within pool.

