[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-review-ml"
version = "0.1.0"
description = "Steam reviews ML utilities"
requires-python = ">=3.9"
dependencies = ["pandas", "pyarrow", "tqdm", "numpy", "scikit-learn"]

[project.optional-dependencies]
# Recommender notebooks / ContentRetriever need TensorFlow + TensorFlow Hub. Pip cannot install conda-forge builds;
# use conda-forge in the env (typical for CUDA), then: pip install -e .  (and .[api] if you serve HTTP).
# Use recs-pip only in pip-only environments (e.g. Docker); do not mix with conda-managed TensorFlow.
recs-pip = ["tensorflow>=2.15.0", "tensorflow-hub>=0.16.0"]
api = ["fastapi>=0.100.0", "uvicorn[standard]>=0.22.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steam_review_ml = ["api/static/*.html"]
