[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-review-ml"
version = "0.1.0"
description = "Steam reviews ML utilities"
requires-python = ">=3.9"
dependencies = ["pandas", "pyarrow"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]