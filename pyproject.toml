[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-review-ml"
version = "0.1.0"
description = "Steam reviews ML utilities"
requires-python = ">=3.9"
dependencies = ["pandas", "pyarrow", "tqdm", "numpy", "scikit-learn"]

[project.optional-dependencies]
recs = ["tensorflow>=2.15.0", "tensorflow-hub>=0.16.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]